<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="body" cx="40%" cy="36%" r="68%">
      <stop offset="0" stop-color="#8278ff" stop-opacity=".22"/>
      <stop offset=".35" stop-color="#0a0a2a" stop-opacity=".55"/>
      <stop offset=".78" stop-color="#0e1254" stop-opacity=".82"/>
      <stop offset="1" stop-color="#2a36d2" stop-opacity=".96"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="8" y2="8">
      <stop offset="0" stop-color="#78d7ff" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#7890ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#b070ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1e2282" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="caustic" gradientUnits="userSpaceOnUse" x1="55" y1="55" x2="30" y2="30">
      <stop offset="0" stop-color="#78d7ff" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#506eff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4650ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="30" y2="30">
      <stop offset="0" stop-color="#ebe8ff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#a096ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#786eff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#d7d2ff" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#877dff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#6e64ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#e6e1ff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#b9afff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#ebfaff"/>
      <stop offset="1" stop-color="#78c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d2d7ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d7dcff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#d2d7ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="32" cy="32" r="28"/></clipPath>
    <mask id="gloss-m">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="32" cy="32" r="28" fill="#fff"/>
      <circle r="28" fill="#000">
        <animate attributeName="cx" values="36.6;37.8;36.6" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="37;36;37" dur="7s" repeatCount="indefinite"/>
      </circle>
    </mask>
    <mask id="caustic-m">
      <rect width="64" height="64" fill="#000"/>
      <circle cx="32" cy="32" r="28" fill="#fff"/>
      <circle r="28" fill="#000">
        <animate attributeName="cx" values="26;24.8;26" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="25.5;24.5;25.5" dur="6s" repeatCount="indefinite"/>
      </circle>
    </mask>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#6473ff" stroke-width="1.6" stroke-opacity=".6" filter="url(#halo)"/>
  <circle cx="32" cy="32" r="28" fill="url(#body)"/>

  <g clip-path="url(#clip)">
    <circle cx="32" cy="32" r="26.4" fill="none" stroke="url(#rim)" stroke-width="7">
      <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect width="64" height="64" fill="url(#caustic)" mask="url(#caustic-m)"/>
    <rect width="64" height="64" fill="url(#gloss)" mask="url(#gloss-m)">
      <animate attributeName="opacity" values="1;.82;1" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="32" cy="32" r="23.8" fill="none" stroke="#aab4ff" stroke-opacity=".16" stroke-width=".8"/>
    <rect x="-20" y="8" width="18" height="48" fill="url(#sweep)" transform="skewX(-15)">
      <animate attributeName="x" values="-20;72" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="32" cy="32" r="27.6" fill="none" stroke="#96a0ff" stroke-opacity=".6" stroke-width=".9"/>

  <circle cx="46.5" cy="45" r="3.4" fill="url(#spark)">
    <animate attributeName="opacity" values=".95;.3;.95" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 3 2; 0 3; -3 1; 0 0" dur="4.8s" repeatCount="indefinite"/>
    <circle cx="22" cy="21.5" r="10" fill="url(#glow)">
      <animate attributeName="r" values="8.5;10.5;8.5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="21.5" r="4" fill="url(#core)"/>
  </g>
</svg>